[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Visitor statistics: nightly summary of the previous days (00:20 UTC). Scheduled
# functions only run on the published production deploy. See netlify/lib/stats-core.js.
[functions."stats-compact"]
  schedule = "20 0 * * *"

# One hop from any www or http variant to the canonical https apex. Without these,
# http://www went to https://www and only then to the apex: two redirects, on a URL
# that still had 79 clicks in the 17 Sep Search Console baseline. Only matches on the
# live domain; the preview is unaffected.
[[redirects]]
  from = "http://www.punjabifolkentertainment.com/*"
  to = "https://punjabifolkentertainment.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.punjabifolkentertainment.com/*"
  to = "https://punjabifolkentertainment.com/:splat"
  status = 301
  force = true

# Internal files must not be served publicly. force = true is REQUIRED:
# without it Netlify serves the file from disk and never reaches the rule. CLAUDE.md was readable on the live
# site and exposed the Netlify site ID, env var names and the quote-page access
# model. Redirects are evaluated in order, so these sit above the /quote/* rule.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SEO-README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SEO-GUIDE-STATUS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Reena_Kaur_SEO_Suggested_Edits.txt"
  to = "/404.html"
  status = 404
  force = true

# Function source and its shared code (netlify/functions, netlify/lib). The functions
# themselves are served at /.netlify/functions/, which this does not touch.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Generator scripts for internal pages (tools/build-faq-review.js).
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# The Videos page was renamed Gallery on 21 Sep 2026. videos.html was indexed on
# the live site, so the old URL must 301 to keep its ranking and any shared links.
[[redirects]]
  from = "/videos.html"
  to = "/gallery.html"
  status = 301
  force = true

[[redirects]]
  from = "/videos"
  to = "/gallery.html"
  status = 301
  force = true

# Clean quote URLs: /quote/<name-slug>-<id> serves the quote page.
# The page reads the id from the path; the random suffix is the access token.
[[redirects]]
  from = "/quote/*"
  to = "/quote.html"
  status = 200

# FAQ review checklist for Reena (faq-review.html). The review finished and the page was
# deleted on 2 Oct 2026. Kept so that, if tools/build-faq-review.js is ever re-run for a
# new round, the regenerated page is still never indexed. See SEO-README.md section 4b.
[[headers]]
  for = "/faq-review.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Private pages. robots.txt no longer disallows these, so Google can fetch them and
# see this header. A Disallow would hide the noindex from it. They are also noindex
# in their own markup.
# Visitor statistics dashboard (password-gated by stats-api.js). Also noindex in its markup.
[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/quote.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/quote/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
